version: '3.9'
services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: finance_learning_app
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appsecret
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
